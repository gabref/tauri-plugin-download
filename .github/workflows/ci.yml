name: Windows IPC verification
on: push
jobs:
   windows-ipc:
      runs-on: windows-latest
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@v4
         - uses: actions-rust-lang/setup-rust-toolchain@v1
           with:
              toolchain: '1.94.0'
              cache: true
         - name: Run desktop IPC tests on Windows
           run: cargo test -p tauri-plugin-download --lib ipc_tests
