name: Review regression check
on: push
jobs:
   background-order:
      runs-on: macos-15
      timeout-minutes: 10
      steps:
         - uses: actions/checkout@v4
         - run: python3 review_mutation.py
         - uses: actions/upload-artifact@v4
           if: always()
           with:
              name: background-order-results
              path: review-results/
