name: Issue 79 Mutation Checks
on:
   push:
      branches: [test/issue-79-mutation-checks]
permissions:
   contents: read
jobs:
   swift-mutations:
      runs-on: macos-15
      timeout-minutes: 15
      steps:
         - uses: actions/checkout@v4
         - run: python3 mutation_checks.py swift
         - uses: actions/upload-artifact@v4
           if: always()
           with:
              name: swift-mutation-results
              path: mutation-results/
   android-emulator:
      name: Android Instrumented Tests
      runs-on: ubuntu-24.04
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-java@v4
           with:
              distribution: 'temurin'
              java-version: '17'
              cache: 'gradle'
         - uses: android-actions/setup-android@v3
           with:
              packages: 'platform-tools'
         - name: Enable KVM
           run: |
              echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
              sudo udevadm control --reload-rules
              sudo udevadm trigger --name-match=kvm
         - uses: actions-rust-lang/setup-rust-toolchain@v1
           with:
              toolchain: '1.94.0'
              target: aarch64-linux-android
              cache: true
         - name: Prepare Tauri Android API for plugin tests
           run: |
              NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
              export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
              export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
              cargo check --locked --target aarch64-linux-android
         - name: Run instrumented tests
           uses: reactivecircus/android-emulator-runner@v2
           with:
              api-level: 35
              target: google_apis
              arch: x86_64
              working-directory: android
              script: python3 ../mutation_checks.py android
         - name: Upload instrumented test reports
           if: always()
           uses: actions/upload-artifact@v4
           with:
              name: android-mutation-results
              path: |
                 mutation-results/
                 android/lib/build/reports/androidTests/
                 android/lib/build/outputs/androidTest-results/
                 android/build/reports/androidTests/
                 android/build/outputs/androidTest-results/

