name: PR review verification
on: push
jobs:
   swift-regressions:
      runs-on: macos-15-intel
      timeout-minutes: 15
      steps:
         - uses: actions/checkout@v4
         - run: python3 review_mutations.py
         - uses: actions/upload-artifact@v4
           if: always()
           with:
              name: swift-review-regressions
              path: review-results/
   windows-ipc:
      runs-on: windows-latest
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@v4
         - uses: actions-rust-lang/setup-rust-toolchain@v1
           with:
              toolchain: '1.94.0'
              cache: true
         - name: Run desktop IPC tests on Windows
           run: cargo test -p tauri-plugin-download --lib ipc_tests
