name: CI

on:
   push: # Runs on push to any branch
   pull_request:
      branches: [ "master" ]

env:
   CARGO_TERM_COLOR: always

jobs:
   windows:
      name: Windows Plugin Tests
      runs-on: windows-latest
      timeout-minutes: 30

      steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Setup Rust toolchain
           uses: actions-rust-lang/setup-rust-toolchain@v1
           with:
              toolchain: '1.94.0'
              cache: true

         - name: Run IPC integration tests
           run: cargo test -p tauri-plugin-download --locked --test ipc

         - name: Run plugin tests
           run: cargo test -p tauri-plugin-download --locked

